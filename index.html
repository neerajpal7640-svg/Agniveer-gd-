<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>90 Days Challenge - Neeraj Pal</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg-card: rgba(20, 20, 20, 0.95);
            --text-color: #ffffff;
            --border-color: rgba(255, 255, 255, 0.15);
        }

        body.light-mode {
            --bg-card: rgba(240, 240, 240, 0.95);
            --text-color: #121212;
            --border-color: rgba(0, 0, 0, 0.15);
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: url('https://images.unsplash.com/photo-1532375810709-75b1da00537c?q=80&w=1000&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-color);
            transition: all 0.3s ease;
        }

        .overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1;
        }

        .top-bar {
            position: absolute;
            top: 15px;
            right: 20px;
            z-index: 10;
        }

        .settings-btn {
            background: rgba(255, 153, 51, 0.2);
            border: 1px solid #FF9933;
            color: #FF9933;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        .settings-btn:hover {
            background: #FF9933;
            color: #121212;
        }

        .main-card {
            position: relative;
            z-index: 2;
            width: 95%;
            max-width: 900px;
            background: var(--bg-card);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7);
            text-align: center;
            margin: 20px 0;
        }

        .creator-title {
            font-size: 0.9rem;
            letter-spacing: 2px;
            color: #FF9933;
            text-transform: uppercase;
            font-weight: 600;
        }

        .name-header {
            font-family: 'Cinzel', serif;
            font-size: 2.8rem;
            font-weight: 900;
            letter-spacing: 3px;
            text-transform: uppercase;
            background: linear-gradient(135deg, #FF9933 0%, #FFFFFF 50%, #128807 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
        }

        .subtitle { font-size: 1rem; opacity: 0.9; margin-bottom: 20px; }

        .info-card {
            background: rgba(255, 255, 255, 0.05);
            border-left: 4px solid #FF9933;
            padding: 12px 15px;
            border-radius: 8px;
            font-size: 0.9rem;
            text-align: left;
            margin-bottom: 20px;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            gap: 10px;
            max-height: 380px;
            overflow-y: auto;
            padding: 10px;
            border-top: 1px solid var(--border-color);
        }

        .grid-container::-webkit-scrollbar { width: 6px; }
        .grid-container::-webkit-scrollbar-thumb { background: #FF9933; border-radius: 10px; }

        .day-box {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 12px 8px;
            transition: all 0.3s ease;
        }

        .day-box.unlocked {
            background: rgba(40, 167, 69, 0.25);
            border-color: #28a745;
            cursor: pointer;
        }

        .day-box.locked {
            opacity: 0.4;
            cursor: not-allowed;
            filter: grayscale(100%);
        }

        .day-title { font-size: 1rem; font-weight: 700; }
        .score-text { font-size: 0.8rem; color: #ffca28; margin-top: 5px; font-weight: 600; }

        /* Modal Overlay */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.88);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }

        .modal-card {
            background: #1a1a1a;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 25px;
            border-radius: 15px;
            width: 90%;
            max-width: 600px;
            color: #fff;
        }

        .setting-item {
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
        }

        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
            margin-bottom: 15px;
            color: #FF9933;
        }

        .question-box {
            margin-bottom: 20px;
            min-height: 180px;
        }

        .question-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 15px;
            line-height: 1.4;
        }

        .option-btn {
            display: block;
            width: 100%;
            text-align: left;
            padding: 12px 15px;
            margin: 8px 0;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: #fff;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .option-btn:hover { background: rgba(255, 153, 51, 0.2); border-color: #FF9933; }
        .option-btn.selected { background: #FF9933; color: #121212; font-weight: bold; }

        .nav-buttons {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .btn-action {
            flex: 1;
            padding: 10px;
            background: #28a745;
            color: white;
            font-size: 0.95rem;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .btn-secondary { background: #555; }
        .btn-danger { background: #dc3545; }

        @media (max-width: 600px) { .name-header { font-size: 2rem; } }
    </style>
</head>
<body>

    <div class="overlay"></div>

    <div class="top-bar">
        <button class="settings-btn" onclick="openSettings()">⚙️ Settings</button>
    </div>

    <div class="main-card">
        <div class="creator-title">Created By</div>
        <h1 class="name-header">NEERAJ PAL</h1>
        <div class="subtitle">Agniveer GD 90-Day Challenge (4500 Questions)</div>

        <div class="info-card">
            <h4>🎯 Unlocking Rule:</h4>
            <p>अगला दिन अनलॉक करने के लिए टेस्ट में कम से कम <b id="rulePercentageText">70%</b> अंक प्राप्त करना अनिवार्य है।</p>
        </div>

        <div class="grid-container" id="daysGrid"></div>
    </div>

    <!-- Settings Modal -->
    <div class="modal-overlay" id="settingsModal">
        <div class="modal-card">
            <h3 style="color: #FF9933; text-align: center; margin-bottom: 20px;">⚙️ App Settings</h3>
            
            <div class="setting-item">
                <label>Pass Percentage Requirement (%)</label>
                <input type="number" id="passPercentInput" min="10" max="100" value="70" style="width:70px; text-align:center;">
            </div>

            <div class="setting-item">
                <label>Sound Effects (ध्वनि प्रभाव)</label>
                <input type="checkbox" id="soundToggle" checked>
            </div>

            <div class="setting-item">
                <label>Light Theme Toggle</label>
                <input type="checkbox" id="themeToggle" onchange="toggleTheme()">
            </div>

            <div class="setting-item">
                <label style="color: #ff4d4d;">Reset All Progress</label>
                <button class="btn-action btn-danger" style="width: auto; padding: 5px 10px;" onclick="resetProgress()">Reset</button>
            </div>

            <button class="btn-action" onclick="saveSettings()">Save & Close</button>
        </div>
    </div>

    <!-- Single Question Quiz Modal -->
    <div class="modal-overlay" id="quizModal">
        <div class="modal-card">
            <div class="quiz-header">
                <span id="quizTitle" style="font-weight: bold;">Day 1 Test</span>
                <span id="questionCounter" style="color: #fff; font-size: 0.9rem;">Q 1 / 50</span>
            </div>

            <div class="question-box">
                <div class="question-title" id="qText">Question Text Here</div>
                <div id="optionsContainer"></div>
            </div>

            <div class="nav-buttons">
                <button class="btn-action btn-secondary" id="prevBtn" onclick="prevQuestion()">Previous</button>
                <button class="btn-action" id="nextBtn" onclick="nextQuestion()">Next</button>
            </div>

            <button class="btn-action btn-danger" style="margin-top: 10px;" onclick="closeQuiz()">Exit Test</button>
        </div>
    </div>

    <script>
        const TOTAL_DAYS = 90;
        const QUESTIONS_PER_DAY = 50;
        
        let currentDay = 1;
        let currentQIndex = 0;
        let userAnswers = {};

        // अग्निवीर GD मॉडल प्रश्न सेट (Sample Authentic Questions)
        const agniveerSampleBank = [
            { q: "भारत का पहला उपग्रह कौन सा है?", opts: ["आर्यभट्ट", "रोहिणी", "भास्कर", "इंसाड"], ans: 0 },
            { q: "अर्जुन पुरस्कार किस क्षेत्र में दिया जाता है?", opts: ["साहित्य", "खेल", "सिनेमा", "विज्ञान"], ans: 1 },
            { q: "भारतीय सेना का सर्वोच्च सेनापति कौन होता है?", opts: ["प्रधान मंत्री", "रक्षा मंत्री", "राष्ट्रपति", "चीफ ऑफ आर्मी स्टाफ"], ans: 2 },
            { q: "पानीपत की पहली लड़ाई कब हुई थी?", opts: ["1526", "1556", "1761", "1530"], ans: 0 },
            { q: "विटामिन C की कमी से कौन सा रोग होता है?", opts: ["रौतौंधी", "स्कर्वी", "बेरी-बेरी", "रिकेट्स"], ans: 1 },
            { q: "विद्युत धारा की SI इकाई क्या है?", opts: ["वोल्ट", "ओम", "एम्पीयर", "वाट"], ans: 2 },
            { q: "काजीरंगा राष्ट्रीय उद्यान किस राज्य में स्थित है?", opts: ["असम", "बिहार", "पश्चिम बंगाल", "ओडिशा"], ans: 0 },
            { q: "मनुष्य के शरीर में कुल कितनी हड्डियाँ होती हैं?", opts: ["206", "208", "300", "180"], ans: 0 },
            { q: "विश्व की सबसे लंबी नदी कौन सी है?", opts: ["अमेज़न", "नील", "गंगा", "मिसिसिपी"], ans: 1 },
            { q: "यदि A:B = 2:3 और B:C = 4:5, तो A:C का मान क्या होगा?", opts: ["8:15", "6:10", "2:5", "8:10"], ans: 0 }
        ];

        // 4500 प्रश्नों का अग्निवीर GD पैटर्न स्ट्रक्चर
        const questionBank = {};
        for (let d = 1; d <= TOTAL_DAYS; d++) {
            questionBank[d] = [];
            for (let q = 1; q <= QUESTIONS_PER_DAY; q++) {
                const sample = agniveerSampleBank[(q - 1) % agniveerSampleBank.length];
                questionBank[d].push({
                    q: `[अग्निवीर GD - Day ${d}] Q${q}. ${sample.q}`,
                    opts: sample.opts,
                    ans: sample.ans
                });
            }
        }

        let settings = JSON.parse(localStorage.getItem('neeraj_app_settings')) || { passPercentage: 70, soundEnabled: true, lightMode: false };
        let savedData = JSON.parse(localStorage.getItem('neeraj_90day_quiz')) || { unlockedUpTo: 1, scores: {} };

        function initSettings() {
            document.getElementById('passPercentInput').value = settings.passPercentage;
            document.getElementById('soundToggle').checked = settings.soundEnabled;
            document.getElementById('themeToggle').checked = settings.lightMode;
            document.getElementById('rulePercentageText').innerText = settings.passPercentage + '%';
            if (settings.lightMode) document.body.classList.add('light-mode');
        }

        function openSettings() { document.getElementById('settingsModal').style.display = 'flex'; }
        
        function saveSettings() {
            const passVal = parseInt(document.getElementById('passPercentInput').value);
            if (passVal >= 10 && passVal <= 100) settings.passPercentage = passVal;
            settings.soundEnabled = document.getElementById('soundToggle').checked;
            localStorage.setItem('neeraj_app_settings', JSON.stringify(settings));
            document.getElementById('rulePercentageText').innerText = settings.passPercentage + '%';
            document.getElementById('settingsModal').style.display = 'none';
        }

        function toggleTheme() {
            settings.lightMode = document.getElementById('themeToggle').checked;
            if (settings.lightMode) document.body.classList.add('light-mode');
            else document.body.classList.remove('light-mode');
        }

        function resetProgress() {
            if (confirm("क्या आप अपनी पूरी 90 दिनों की प्रोग्रेस रीसेट करना चाहते हैं?")) {
                savedData = { unlockedUpTo: 1, scores: {} };
                localStorage.setItem('neeraj_90day_quiz', JSON.stringify(savedData));
                buildGrid();
                document.getElementById('settingsModal').style.display = 'none';
            }
        }

        function buildGrid() {
            const grid = document.getElementById('daysGrid');
            grid.innerHTML = '';
            for (let day = 1; day <= TOTAL_DAYS; day++) {
                const isUnlocked = day <= savedData.unlockedUpTo;
                const score = savedData.scores[day];

                const dayCard = document.createElement('div');
                dayCard.className = `day-box ${isUnlocked ? 'unlocked' : 'locked'}`;
                dayCard.innerHTML = `
                    <div class="day-title">Day ${day}</div>
                    <small style="font-size:0.75rem;">${isUnlocked ? 'Unlocked' : 'Locked'}</small>
                    ${score !== undefined ? `<div class="score-text">${score}%</div>` : ''}
                `;
                if (isUnlocked) dayCard.onclick = () => startQuiz(day);
                grid.appendChild(dayCard);
            }
        }

        function startQuiz(day) {
            currentDay = day;
            currentQIndex = 0;
            userAnswers = {};
            document.getElementById('quizTitle').innerText = `Day ${day} अग्निवीर GD Test`;
            document.getElementById('quizModal').style.display = 'flex';
            loadQuestion();
        }

        function loadQuestion() {
            const qData = questionBank[currentDay][currentQIndex];
            document.getElementById('questionCounter').innerText = `Q ${currentQIndex + 1} / ${QUESTIONS_PER_DAY}`;
            document.getElementById('qText').innerText = qData.q;

            const optsContainer = document.getElementById('optionsContainer');
            optsContainer.innerHTML = '';

            qData.opts.forEach((optText, idx) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                if (userAnswers[currentQIndex] === idx) btn.classList.add('selected');
                btn.innerText = `${String.fromCharCode(65 + idx)}. ${optText}`;
                btn.onclick = () => selectOption(idx);
                optsContainer.appendChild(btn);
            });

            document.getElementById('prevBtn').style.display = currentQIndex === 0 ? 'none' : 'block';
            document.getElementById('nextBtn').innerText = currentQIndex === QUESTIONS_PER_DAY - 1 ? 'Submit Test' : 'Next';
        }

        function selectOption(idx) {
            userAnswers[currentQIndex] = idx;
            loadQuestion();
        }

        function nextQuestion() {
            if (currentQIndex < QUESTIONS_PER_DAY - 1) {
                currentQIndex++;
                loadQuestion();
            } else {
                submitTest();
            }
        }

        function prevQuestion() {
            if (currentQIndex > 0) {
                currentQIndex--;
                loadQuestion();
            }
        }

        function closeQuiz() {
            document.getElementById('quizModal').style.display = 'none';
        }

        function submitTest() {
            let correctCount = 0;
            const qList = questionBank[currentDay];

            qList.forEach((qObj, idx) => {
                if (userAnswers[idx] === qObj.ans) {
                    correctCount++;
                }
            });

            const percentage = Math.round((correctCount / QUESTIONS_PER_DAY) * 100);
            savedData.scores[currentDay] = percentage;
            const targetPass = settings.passPercentage;

            if (percentage >= targetPass) {
                if (currentDay === savedData.unlockedUpTo && currentDay < TOTAL_DAYS) {
                    savedData.unlockedUpTo = currentDay + 1;
                    alert(`शानदार प्रदर्शन! आपका स्कोर: ${percentage}% (${correctCount}/50 सही)। Day ${currentDay + 1} अनलॉक हो गया!`);
                } else {
                    alert(`आपका स्कोर: ${percentage}% (${correctCount}/50 सही)`);
                }
            } else {
                alert(`आपका स्कोर: ${percentage}% (${correctCount}/50 सही)। पास होने के लिए कम से कम ${targetPass}% अंक चाहिए!`);
            }

            localStorage.setItem('neeraj_90day_quiz', JSON.stringify(savedData));
            closeQuiz();
            buildGrid();
        }

        initSettings();
        buildGrid();
    </script>
</body>
</html>
